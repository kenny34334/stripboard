<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop Film Plot Stripboard</title>
    <style>
        :root {
            --bg-color: #f1f3f6;
            --panel-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --accent-color: #0ea5e9;
            --accent-hover: #0284c7;
            --btn-dark: #1e293b;
            --btn-dark-hover: #0f172a;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
            justify-content: space-between;
        }

        .top-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            width: 100%;
        }

        .project-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 500;
        }

        .project-group select {
            border: none;
            background: transparent;
            font-size: 0.95rem;
            color: var(--text-color);
            outline: none;
            cursor: pointer;
        }

        button {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.15s, border-color 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        button:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        button.primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        button.primary:hover {
            background-color: var(--accent-hover);
        }

        button.dark-btn {
            background-color: var(--btn-dark);
            border-color: var(--btn-dark);
            color: white;
        }

        button.dark-btn:hover {
            background-color: var(--btn-dark-hover);
        }

        button.danger-text {
            color: #b91c1c;
            border-color: #fca5a5;
        }
        button.danger-text:hover {
            background-color: #fee2e2;
        }

        .main-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        h2.project-title {
            margin: 0 0 15px 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-row input[type="text"] {
            flex-grow: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            background: #fff;
        }

        .input-row input[type="text"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.15);
        }

        .stripboard-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
            min-height: 300px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
        }

        .strip-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .strip-card {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-left: 5px solid #fbcfe8;
            border-radius: 4px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            cursor: grab;
            user-select: none;
            transition: background 0.1s, box-shadow 0.1s;
        }

        .strip-card:hover {
            background-color: #f1f5f9;
        }

        .strip-card.dragging {
            opacity: 0.4;
            cursor: grabbing;
        }

        .strip-card.selected {
            background-color: #ecfdf5;
            border-color: #10b981;
            border-left-color: #10b981;
        }

        /* Divider styling (dunne grijze balk zonder tekst) */
        .strip-card.divider {
            background-color: #64748b;
            border: none;
            border-left: none;
            padding: 0;
            height: 6px;
            min-height: 6px;
            border-radius: 3px;
            cursor: grab;
        }
        .strip-card.divider:hover {
            background-color: #475569;
        }
        .strip-card.divider.selected {
            background-color: #10b981;
            border: none;
        }

        .strip-title {
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-color);
            flex-grow: 1;
        }

        .strip-right {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .action-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: none;
        }

        .action-btn:hover {
            background-color: #e2e8f0;
        }

        /* Kleurenmenu popover */
        .color-picker-popup {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 4px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            padding: 6px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .color-picker-popup.hidden {
            display: none;
        }

        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            cursor: pointer;
            padding: 0;
        }

        .color-dot:hover {
            transform: scale(1.1);
        }

        /* Uitklapbaar dialoog/ideeën vakje */
        .strip-dialogue-panel {
            display: none;
            background: #f8fafc;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 10px;
            margin-left: 15px;
        }

        .strip-dialogue-panel.open {
            display: block;
        }

        .strip-dialogue-panel textarea {
            width: 100%;
            height: 60px;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.85rem;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
        }

        .strip-dialogue-panel textarea:focus {
            border-color: var(--accent-color);
        }

        .bottom-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="top-toolbar">
            <div class="project-group">
                <span>Film Project:</span>
                <select id="projectSelect" onchange="switchProject(this.value)">
                    <!-- Dynamisch -->
                </select>
            </div>
            <button class="dark-btn" onclick="addNewProject()">+ Nieuw</button>
            <button onclick="renameCurrentProject()">Hernoem</button>
            <button class="danger-text" onclick="deleteCurrentProject()">Verwijder</button>
        </div>
    </header>

    <main class="main-card">
        <div>
            <h2 id="mainProjectTitle" class="project-title">Mijn Eerste Film</h2>
        </div>

        <div class="input-row">
            <input type="text" id="newPlotInput" placeholder="Enter a one-sentence plot point..." onkeydown="if(event.key === 'Enter') addStrip()">
            <button class="dark-btn" onclick="addStrip()">Add Strip</button>
        </div>

        <div id="stripboardContainer" class="stripboard-container" ondragover="event.preventDefault()">
            <!-- Strips komen hier -->
        </div>

        <div class="bottom-actions">
            <button class="danger-text" onclick="deleteSelectedStrips()">Delete Selected</button>
            <button onclick="resetBoard()">Reset Board</button>
        </div>
    </main>

    <script>
        let appData = {
            projects: [
                {
                    id: 1,
                    title: "Mijn Eerste Film",
                    strips: [
                        { id: 1, title: "", type: "divider", selected: false, colorMenuOpen: false },
                        { id: 2, title: "", type: "divider", selected: false, colorMenuOpen: false },
                        { id: 3, title: "", type: "divider", selected: false, colorMenuOpen: false },
                        { id: 101, title: "HMO3", type: "strip", color: "#fbcfe8", selected: false, dialogue: "", dialogueOpen: false, colorMenuOpen: false },
                        { id: 102, title: "HMO 2", type: "strip", color: "#fde047", selected: true, dialogue: "Idee: hier een spannende introductie.", dialogueOpen: false, colorMenuOpen: false },
                        { id: 103, title: "HMO", type: "strip", color: "#86efac", selected: false, dialogue: "", dialogueOpen: false, colorMenuOpen: false },
                        { id: 104, title: "fff", type: "strip", color: "#93c5fd", selected: false, dialogue: "", dialogueOpen: false, colorMenuOpen: false }
                    ]
                }
            ]
        };

        let currentProjectId = 1;
        let draggedIndex = null;

        const customColors = [
            { name: "Geel", value: "#fde047" },
            { name: "Groen", value: "#86efac" },
            { name: "Blauw", value: "#93c5fd" },
            { name: "Lichtroze", value: "#fbcfe8" }
        ];

        function init() {
            loadFromLocalStorage();
            renderProjectDropdown();
            renderWorkspace();
            
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.strip-right')) {
                    const project = getCurrentProject();
                    let changed = false;
                    project.strips.forEach(s => {
                        if (s.colorMenuOpen) {
                            s.colorMenuOpen = false;
                            changed = true;
                        }
                    });
                    if (changed) renderWorkspace();
                }
            });
        }

        function renderProjectDropdown() {
            const select = document.getElementById('projectSelect');
            select.innerHTML = '';
            appData.projects.forEach(project => {
                const opt = document.createElement('option');
                opt.value = project.id;
                opt.innerText = project.title;
                if (project.id === currentProjectId) opt.selected = true;
                select.appendChild(opt);
            });
            const mainTitle = document.getElementById('mainProjectTitle');
            const currentProj = getCurrentProject();
            if (mainTitle && currentProj) mainTitle.innerText = currentProj.title;
        }

        function switchProject(id) {
            currentProjectId = Number(id);
            renderProjectDropdown();
            renderWorkspace();
        }

        function getCurrentProject() {
            return appData.projects.find(p => p.id === currentProjectId) || appData.projects[0];
        }

        function renderWorkspace() {
            const project = getCurrentProject();
            const container = document.getElementById('stripboardContainer');
            container.innerHTML = '';

            if (!project || project.strips.length === 0) {
                container.innerHTML = `<div class="empty-state">Geen items gevonden. Voeg er een toe hierboven.</div>`;
                return;
            }

            project.strips.forEach((strip, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'strip-wrapper';

                const card = document.createElement('div');
                card.draggable = true;
                card.dataset.index = index;

                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('drop', handleDrop);
                card.addEventListener('dragend', handleDragEnd);

                if (strip.type === 'divider') {
                    card.className = `strip-card divider ${strip.selected ? 'selected' : ''}`;
                    card.addEventListener('click', (e) => {
                        strip.selected = !strip.selected;
                        saveToLocalStorage();
                        renderWorkspace();
                    });
                    card.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        if (confirm(`Weet je zeker dat je deze divider wilt verwijderen?`)) {
                            deleteStrip(strip.id);
                        }
                    });
                } else {
                    card.className = `strip-card ${strip.selected ? 'selected' : ''}`;
                    card.style.borderLeftColor = strip.color || '#fbcfe8';

                    card.addEventListener('click', (e) => {
                        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('.color-picker-popup')) return;
                        strip.selected = !strip.selected;
                        saveToLocalStorage();
                        renderWorkspace();
                    });

                    card.addEventListener('dblclick', () => {
                        editStrip(strip.id);
                    });

                    card.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        if (confirm(`Weet je zeker dat je "${strip.title}" wilt verwijderen?`)) {
                            deleteStrip(strip.id);
                        }
                    });

                    let colorDotsHtml = customColors.map(c => 
                        `<button class="color-dot" style="background-color: ${c.value};" title="${c.name}" onclick="setStripColor(${strip.id}, '${c.value}')"></button>`
                    ).join('');

                    card.innerHTML = `
                        <div class="strip-title">${escapeHtml(strip.title)}</div>
                        <div class="strip-right">
                            <button class="action-btn" title="Dialoog / ideeën" onclick="toggleDialogue(${strip.id})">✒️</button>
                            <button class="action-btn" title="Kies kleur" onclick="toggleColorMenu(${strip.id})" style="background-color: ${strip.color || '#fbcfe8'}; width: 24px; height: 24px; padding: 0; border-radius: 50%;"></button>
                            <div class="color-picker-popup ${strip.colorMenuOpen ? '' : 'hidden'}">
                                ${colorDotsHtml}
                            </div>
                        </div>
                    `;

                    const dialoguePanel = document.createElement('div');
                    dialoguePanel.id = `dialogue-panel-${strip.id}`;
                    dialoguePanel.className = `strip-dialogue-panel ${strip.dialogueOpen ? 'open' : ''}`;
                    dialoguePanel.innerHTML = `
                        <textarea placeholder="Typ hier je dialoog of ideeën..." oninput="updateDialogue(${strip.id}, this.value)">${escapeHtml(strip.dialogue || '')}</textarea>
                    `;
                    wrapper.appendChild(card);
                    wrapper.appendChild(dialoguePanel);
                    container.appendChild(wrapper);
                    return;
                }

                wrapper.appendChild(card);
                container.appendChild(wrapper);
            });
        }

        function toggleDialogue(id) {
            const project = getCurrentProject();
            const strip = project.strips.find(s => s.id === id);
            if (strip) {
                strip.dialogueOpen = !strip.dialogueOpen;
                saveToLocalStorage();
                renderWorkspace();
            }
        }

        function toggleColorMenu(id) {
            const project = getCurrentProject();
            project.strips.forEach(s => {
                if (s.id === id) {
                    s.colorMenuOpen = !s.colorMenuOpen;
                } else {
                    s.colorMenuOpen = false;
                }
            });
            renderWorkspace();
        }

        function setStripColor(id, color) {
            const project = getCurrentProject();
            const strip = project.strips.find(s => s.id === id);
            if (strip) {
                strip.color = color;
                strip.colorMenuOpen = false;
                saveToLocalStorage();
                renderWorkspace();
            }
        }

        function updateDialogue(id, text) {
            const project = getCurrentProject();
            const strip = project.strips.find(s => s.id === id);
            if (strip) {
                strip.dialogue = text;
                saveToLocalStorage();
            }
        }

        function addStrip() {
            const input = document.getElementById('newPlotInput');
            const text = input.value.trim();
            if (!text) return;

            const project = getCurrentProject();
            project.strips.push({
                id: Date.now(),
                title: text,
                type: "strip",
                color: "#fbcfe8",
                selected: false,
                dialogue: "",
                dialogueOpen: false,
                colorMenuOpen: false
            });

            input.value = '';
            saveToLocalStorage();
            renderWorkspace();
        }

        function editStrip(id) {
            const project = getCurrentProject();
            const strip = project.strips.find(s => s.id === id);
            if (!strip || strip.type === 'divider') return;

            const newText = prompt("Bewerk plotpoint:", strip.title);
            if (newText !== null && newText.trim() !== "") {
                strip.title = newText.trim();
                saveToLocalStorage();
                renderWorkspace();
            }
        }

        function deleteStrip(id) {
            const project = getCurrentProject();
            project.strips = project.strips.filter(s => s.id !== id);
            saveToLocalStorage();
            renderWorkspace();
        }

        function deleteSelectedStrips() {
            const project = getCurrentProject();
            project.strips = project.strips.filter(s => !s.selected);
            saveToLocalStorage();
            renderWorkspace();
        }

        function resetBoard() {
            if (confirm("Weet je zeker dat je het bord wilt legen?")) {
                const project = getCurrentProject();
                project.strips = [];
                saveToLocalStorage();
                renderWorkspace();
            }
        }

        function handleDragStart(e) {
            draggedIndex = Number(this.dataset.index);
            this.classList.add('dragging');
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDrop(e) {
            e.preventDefault();
            if (draggedIndex === null) return;

            const rect = this.getBoundingClientRect();
            const midpoint = rect.top + rect.height / 2;
            let targetIndex = Number(this.dataset.index);

            if (e.clientY > midpoint) {
                targetIndex += 1;
            }

            const project = getCurrentProject();
            const movedItem = project.strips.splice(draggedIndex, 1)[0];

            if (draggedIndex < targetIndex) {
                targetIndex -= 1;
            }

            project.strips.splice(targetIndex, 0, movedItem);

            saveToLocalStorage();
            renderWorkspace();
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
            draggedIndex = null;
        }

        function addNewProject() {
            const title = prompt("Naam van het nieuwe filmproject:", "Nieuw Project");
            if (!title) return;

            const newId = Date.now();
            appData.projects.push({
                id: newId,
                title: title.trim(),
                strips: [
                    { id: Date.now() + 1, title: "", type: "divider", selected: false, colorMenuOpen: false },
                    { id: Date.now() + 2, title: "", type: "divider", selected: false, colorMenuOpen: false },
                    { id: Date.now() + 3, title: "", type: "divider", selected: false, colorMenuOpen: false }
                ]
            });

            currentProjectId = newId;
            saveToLocalStorage();
            renderProjectDropdown();
            renderWorkspace();
        }

        function renameCurrentProject() {
            const project = getCurrentProject();
            const newTitle = prompt("Hernoem filmproject:", project.title);
            if (newTitle && newTitle.trim() !== "") {
                project.title = newTitle.trim();
                saveToLocalStorage();
                renderProjectDropdown();
            }
        }

        function deleteCurrentProject() {
            if (appData.projects.length <= 1) {
                alert("Je kunt het laatste project niet verwijderen.");
                return;
            }
            if (confirm("Weet je zeker dat je dit hele project wilt verwijderen?")) {
                appData.projects = appData.projects.filter(p => p.id !== currentProjectId);
                currentProjectId = appData.projects[0].id;
                saveToLocalStorage();
                renderProjectDropdown();
                renderWorkspace();
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function saveToLocalStorage() {
            localStorage.setItem('desktop_stripboard_data', JSON.stringify(appData));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('desktop_stripboard_data');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.projects && parsed.projects.length > 0) {
                        appData = parsed;
                        currentProjectId = appData.projects[0].id;
                    }
                } catch (e) {
                    console.error("Fout bij laden:", e);
                }
            }
        }

        init();
    </script>
</body>
</html>
