<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripboard Studio - Mobile First</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        @media (min-width: 600px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
            body {
                padding: 20px;
            }
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        button, .file-upload-btn, select {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s, border-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:hover, .file-upload-btn:hover, select:hover {
            background-color: #334155;
            border-color: #64748b;
        }

        button.primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
            font-weight: 500;
        }

        button.primary:hover {
            background-color: var(--accent-hover);
        }

        button.danger {
            background-color: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--danger-color);
        }

        button.danger:hover {
            background-color: var(--danger-color);
            color: white;
        }

        input[type="file"] {
            display: none;
        }

        .section-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .project-selector-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .project-selector-wrapper select {
            flex-grow: 1;
            padding: 10px;
        }

        .stripboard-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .strip-card {
            background-color: #1e293b;
            border: 1px solid var(--border-color);
            border-left: 6px solid var(--accent-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: grab;
        }

        .strip-card.dragging {
            opacity: 0.4;
            cursor: grabbing;
        }

        .strip-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .strip-info {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            flex-grow: 1;
        }

        .scene-number {
            font-weight: bold;
            font-size: 1.1rem;
            min-width: 45px;
            background: rgba(255,255,255,0.05);
            padding: 4px 8px;
            border-radius: 4px;
            text-align: center;
        }

        .scene-details {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex-grow: 1;
        }

        .scene-title {
            font-weight: 600;
            font-size: 1rem;
        }

        .scene-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .scene-dialogue {
            background-color: rgba(0, 0, 0, 0.2);
            border-left: 3px solid var(--text-muted);
            padding: 6px 10px;
            font-size: 0.85rem;
            color: #cbd5e1;
            border-radius: 0 4px 4px 0;
            margin-top: 5px;
            font-style: italic;
            white-space: pre-wrap;
        }

        .strip-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-end;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 8px;
            margin-top: 5px;
        }

        .strip-actions button {
            padding: 6px 10px;
            font-size: 0.8rem;
        }

        .color-picker-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.1);
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        input[type="color"] {
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 10px;
            font-size: 0.95rem;
        }

        .project-action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Stripboard Studio <span style="font-size: 0.75rem; color: var(--text-muted);">Mobile Beta</span></h1>
        <div class="toolbar">
            <label class="file-upload-btn" title="Importeer JSON">
                📁 Import
                <input type="file" id="importFile" accept=".json" onchange="importData(event)">
            </label>
            <button onclick="exportData()" title="Exporteer JSON">💾 Export</button>
            <button class="primary" onclick="addNewProject()">+ Project</button>
        </div>
    </header>

    <main>
        <!-- Project Selectie & Beheer -->
        <div class="section-card">
            <div class="project-selector-wrapper">
                <select id="projectSelect" onchange="switchProject(this.value)">
                    <!-- Dynamisch gevuld -->
                </select>
                <button class="danger" onclick="deleteCurrentProject()" title="Verwijder actief project">🗑️</button>
            </div>
            <div class="project-action-row">
                <span id="projectStats" style="font-size: 0.85rem; color: var(--text-muted);">0 scènes</span>
                <button class="primary" onclick="addScene()">+ Scène toevoegen</button>
            </div>
        </div>

        <!-- Stripboard Werkruimte -->
        <div class="section-card">
            <h3 style="margin-top: 0; font-size: 1.05rem; color: #fff; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">Scènes & Stripboard</h3>
            <div id="stripboardContainer" class="stripboard-container">
                <!-- Dynamisch gevuld -->
            </div>
        </div>
    </main>

    <script>
        let appData = {
            projects: [
                {
                    id: 1,
                    title: "VUURWERK - Hoofdfilm",
                    strips: [
                        { id: 101, scene: "Sc. 1", intExt: "EXT.", title: "Wijkplein - Nacht", pages: "2 3/8", desc: "Vuurwerk wordt afgestoken op het plein.", dialogue: "Hoor je dat? Prachtig man!", color: "#3b82f6" },
                        { id: 102, scene: "Sc. 2", intExt: "INT.", title: "Woonkamer - Nacht", pages: "1 1/4", desc: "Gesprek over de jaarwisseling.", dialogue: "Gelukkig nieuwjaar allemaal!", color: "#10b981" }
                    ]
                }
            ]
        };

        let currentProjectId = 1;
        let draggedIndex = null;

        function init() {
            loadFromLocalStorage();
            renderProjectDropdown();
            renderWorkspace();
        }

        function renderProjectDropdown() {
            const select = document.getElementById('projectSelect');
            select.innerHTML = '';
            
            appData.projects.forEach(project => {
                const opt = document.createElement('option');
                opt.value = project.id;
                opt.innerText = project.title;
                if (project.id === currentProjectId) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function switchProject(id) {
            currentProjectId = Number(id);
            renderWorkspace();
        }

        function getCurrentProject() {
            return appData.projects.find(p => p.id === currentProjectId) || appData.projects[0];
        }

        function renderWorkspace() {
            const project = getCurrentProject();
            if (!project) return;

            // Stats update
            const totalPages = project.strips.reduce((acc, s) => acc + parsePages(s.pages), 0);
            document.getElementById('projectStats').innerText = `${project.strips.length} scènes | Geschat: ${(totalPages / 8).toFixed(1)} pag.`;

            const container = document.getElementById('stripboardContainer');
            container.innerHTML = '';

            if (project.strips.length === 0) {
                container.innerHTML = `<div class="empty-state">Dit project heeft nog geen scènes. Voeg er een toe via de knop hierboven!</div>`;
                return;
            }

            project.strips.forEach((strip, index) => {
                const card = document.createElement('div');
                card.className = 'strip-card';
                card.style.borderLeftColor = strip.color || '#3b82f6';
                card.draggable = true;
                card.dataset.index = index;

                // Drag and drop events voor desktop & mobiele touch simulatie
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('drop', handleDrop);
                card.addEventListener('dragend', handleDragEnd);

                let dialogueHtml = strip.dialogue ? `<div class="scene-dialogue">💬 "${escapeHtml(strip.dialogue)}"</div>` : '';

                card.innerHTML = `
                    <div class="strip-header">
                        <div class="strip-info">
                            <span class="scene-number">${escapeHtml(strip.scene)}</span>
                            <div class="scene-details">
                                <div class="scene-title">${escapeHtml(strip.intExt || 'INT.')} ${escapeHtml(strip.title)}</div>
                                <div class="scene-desc">${escapeHtml(strip.desc || '')}</div>
                                ${dialogueHtml}
                            </div>
                        </div>
                        <div style="font-size: 0.85rem; color: var(--text-muted); text-align: right; min-width: 50px;">
                            ${escapeHtml(strip.pages)}p
                        </div>
                    </div>
                    <div class="strip-actions">
                        <div class="color-picker-wrapper" title="Kleur instellen">
                            🎨 <input type="color" value="${strip.color || '#3b82f6'}" onchange="updateStripColor(${strip.id}, this.value)">
                        </div>
                        <button onclick="moveScene(${index}, -1)" ${index === 0 ? 'disabled style="opacity:0.4"' : ''}>⬆️ Omhoog</button>
                        <button onclick="moveScene(${index}, 1)" ${index === project.strips.length - 1 ? 'disabled style="opacity:0.4"' : ''}>⬇️ Omlaag</button>
                        <button onclick="editScene(${strip.id})">✏️ Bewerk</button>
                        <button class="danger" onclick="deleteScene(${strip.id})">🗑️</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- DRAG AND DROP LOGICA ---
        function handleDragStart(e) {
            draggedIndex = Number(this.dataset.index);
            this.classList.add('dragging');
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDrop(e) {
            e.preventDefault();
            const targetIndex = Number(this.dataset.index);
            if (draggedIndex === null || draggedIndex === targetIndex) return;

            const project = getCurrentProject();
            const movedItem = project.strips.splice(draggedIndex, 1)[0];
            project.strips.splice(targetIndex, 0, movedItem);

            saveToLocalStorage();
            renderWorkspace();
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            draggedIndex = null;
        }

        // --- ACTIES VOOR SCÈNES ---
        function moveScene(index, direction) {
            const project = getCurrentProject();
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= project.strips.length) return;

            const temp = project.strips[index];
            project.strips[index] = project.strips[newIndex];
            project.strips[newIndex] = temp;

            saveToLocalStorage();
            renderWorkspace();
        }

        function addScene() {
            const project = getCurrentProject();
            const sceneNr = prompt("Scènenummer (bijv. Sc. 3):", `Sc. ${project.strips.length + 1}`);
            if (!sceneNr) return;

            const intExt = prompt("INT. of EXT.?", "INT.");
            const title = prompt("Locatie / Titel:", "Straat - Dag");
            const pages = prompt("Aantal pagina's (bijv. 1 2/8 of 2):", "1 0/8");
            const desc = prompt("Korte beschrijving van de scène:", "");
            const dialogue = prompt("Belangrijke dialoog / notitie (optioneel):", "");

            project.strips.push({
                id: Date.now(),
                scene: sceneNr,
                intExt: intExt || "INT.",
                title: title || "Naamloze locatie",
                pages: pages || "1",
                desc: desc || "",
                dialogue: dialogue || "",
                color: "#3b82f6"
            });

            saveToLocalStorage();
            renderWorkspace();
        }

        function editScene(id) {
            const project = getCurrentProject();
            const strip = project.strips.find(s => s.id === id);
            if (!strip) return;

            const sceneNr = prompt("Scènenummer:", strip.scene);
            if (sceneNr === null) return;

            const intExt = prompt("INT. of EXT.?", strip.intExt);
            const title = prompt("Locatie / Titel:", strip.title);
            const pages = prompt("Aantal pagina's:", strip.pages);
            const desc = prompt("Beschrijving:", strip.desc);
            const dialogue = prompt("Dialoog / Notitie:", strip.dialogue);

            strip.scene = sceneNr;
            strip.intExt = intExt;
            strip.title = title;
            strip.pages = pages;
            strip.desc = desc;
            strip.dialogue = dialogue;

            saveToLocalStorage();
            renderWorkspace();
        }

        function updateStripColor(id, color) {
            const project = getCurrentProject();
            const strip = project.strips.find(s => s.id === id);
            if (strip) {
                strip.color = color;
                saveToLocalStorage();
                renderWorkspace();
            }
        }

        function deleteScene(id) {
            if (!confirm("Weet je zeker dat je deze scène wilt verwijderen?")) return;
            const project = getCurrentProject();
            project.strips = project.strips.filter(s => s.id !== id);
            saveToLocalStorage();
            renderWorkspace();
        }

        // --- PROJECT BEHEER ---
        function addNewProject() {
            const title = prompt("Naam van het nieuwe filmproject:", "Nieuwe Film");
            if (!title) return;

            const newId = Date.now();
            appData.projects.push({
                id: newId,
                title: title,
                strips: []
            });

            currentProjectId = newId;
            saveToLocalStorage();
            renderProjectDropdown();
            renderWorkspace();
        }

        function deleteCurrentProject() {
            if (appData.projects.length <= 1) {
                alert("Je kunt het laatste project niet verwijderen.");
                return;
            }
            if (!confirm("Weet je zeker dat je dit hele project wilt verwijderen?")) return;

            appData.projects = appData.projects.filter(p => p.id !== currentProjectId);
            currentProjectId = appData.projects[0].id;
            saveToLocalStorage();
            renderProjectDropdown();
            renderWorkspace();
        }

        // --- HELPERS ---
        function parsePages(pagesStr) {
            if (!pagesStr) return 8;
            let parts = pagesStr.trim().split(' ');
            let total = 0;
            for (let part of parts) {
                if (part.includes('/')) {
                    let [num, den] = part.split('/').map(Number);
                    if (den) total += (num / den) * 8;
                } else {
                    let num = Number(part);
                    if (!isNaN(num)) total += num * 8;
                }
            }
            return total || 8;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // --- OPSLAAN & LADEN ---
        function saveToLocalStorage() {
            localStorage.setItem('stripboard_mobile_data', JSON.stringify(appData));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('stripboard_mobile_data');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.projects && parsed.projects.length > 0) {
                        appData = parsed;
                        currentProjectId = appData.projects[0].id;
                    }
                } catch (e) {
                    console.error("Fout bij laden:", e);
                }
            }
        }

        // --- EXPORT & IMPORT ---
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "stripboard_projects.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = (e) => {
                    try {
                        const parsedData = JSON.parse(e.target.result);
                        if (parsedData.projects && Array.isArray(parsedData.projects)) {
                            appData = parsedData;
                            saveToLocalStorage();
                            if (appData.projects.length > 0) {
                                currentProjectId = appData.projects[0].id;
                            }
                            renderProjectDropdown();
                            renderWorkspace();
                            alert("Projecten succesvol geïmporteerd!");
                        } else {
                            alert("Ongeldig bestandsformaat.");
                        }
                    } catch (error) {
                        alert("Fout bij inlezen JSON: " + error);
                    }
                };
            }
        }

        init();
    </script>
</body>
</html>
