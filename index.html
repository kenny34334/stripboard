<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripboard Studio - Beta</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --border-color: #333;
            --text-color: #e0e0e0;
            --text-muted: #888;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #fff;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button, .file-upload-btn {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s, border-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button:hover, .file-upload-btn:hover {
            background-color: #2a2a2a;
            border-color: #555;
        }

        button.primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        button.primary:hover {
            background-color: var(--accent-hover);
        }

        button.danger {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--danger-color);
        }

        button.danger:hover {
            background-color: var(--danger-color);
            color: white;
        }

        input[type="file"] {
            display: none;
        }

        main {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            flex-grow: 1;
            overflow: hidden;
        }

        .sidebar {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 1rem;
            margin-top: 0;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .project-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .project-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
        }

        .project-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .project-item.active {
            background-color: var(--accent-color);
            color: white;
        }

        .workspace {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .stripboard-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .strip-card {
            background-color: #262626;
            border: 1px solid #404040;
            border-left: 6px solid var(--accent-color);
            border-radius: 4px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .strip-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .scene-number {
            font-weight: bold;
            font-size: 1.1rem;
            min-width: 50px;
        }

        .scene-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Stripboard Studio <span style="font-size: 0.8rem; color: var(--text-muted);">v1.2 Beta</span></h1>
        <div class="toolbar">
            <!-- Upload / Download Knoppen -->
            <label class="file-upload-btn" title="Importeer JSON projectenbestand">
                📁 Importeer JSON
                <input type="file" id="importFile" accept=".json" onchange="importData(event)">
            </label>
            <button onclick="exportData()" title="Exporteer alle projecten naar JSON">💾 Exporteer JSON</button>
            <button class="primary" onclick="addNewProject()">+ Nieuw Project</button>
        </div>
    </header>

    <main>
        <div class="sidebar">
            <h2>Projecten</h2>
            <ul id="projectList" class="project-list">
                <!-- Wordt dynamisch gevuld -->
            </ul>
        </div>

        <div class="workspace" id="workspace">
            <div class="empty-state">Selecteer een project of maak een nieuw project aan om te beginnen.</div>
        </div>
    </main>

    <script>
        // Lokale data structuur (compatibel met de python app)
        let appData = {
            projects: [
                {
                    id: 1,
                    title: "VUURWERK - Testproject",
                    strips: [
                        { id: 101, scene: "Sc. 1", intExt: "EXT.", title: "Wijkplein - Nacht", pages: "2 3/8", desc: "Vuurwerk wordt afgestoken op het plein." },
                        { id: 102, scene: "Sc. 2", intExt: "INT.", title: "Woonkamer - Nacht", pages: "1 1/4", desc: "Gesprek over de jaarwisseling." }
                    ]
                }
            ]
        };

        let currentProjectId = 1;

        function init() {
            loadFromLocalStorage();
            renderProjects();
            selectProject(currentProjectId);
        }

        function renderProjects() {
            const list = document.getElementById('projectList');
            list.innerHTML = '';
            
            appData.projects.forEach(project => {
                const li = document.createElement('li');
                li.className = `project-item ${project.id === currentProjectId ? 'active' : ''}`;
                li.innerText = project.title;
                li.onclick = () => selectProject(project.id);
                list.appendChild(li);
            });
        }

        function selectProject(id) {
            currentProjectId = id;
            renderProjects();
            renderWorkspace();
        }

        function renderWorkspace() {
            const workspace = document.getElementById('workspace');
            const project = appData.projects.find(p => p.id === currentProjectId);

            if (!project) {
                workspace.innerHTML = `<div class="empty-state">Geen project geselecteerd.</div>`;
                return;
            }

            let html = `
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
                    <h2 style="margin: 0; color: #fff;">${project.title}</h2>
                    <div>
                        <button class="primary" onclick="addScene(${project.id})">+ Scène Toevoegen</button>
                        <button class="danger" onclick="deleteProject(${project.id})">Verwijder Project</button>
                    </div>
                </div>
                <div class="stripboard-container">
            `;

            if (project.strips.length === 0) {
                html += `<div class="empty-state">Dit project heeft nog geen scènes. Voeg er een toe!</div>`;
            } else {
                project.strips.forEach(strip => {
                    html += `
                        <div class="strip-card">
                            <div class="strip-info">
                                <span class="scene-number">${strip.scene}</span>
                                <div>
                                    <div style="font-weight: 500;">${strip.intExt} ${strip.title}</div>
                                    <div class="scene-desc">${strip.desc || ''}</div>
                                </div>
                            </div>
                            <div style="font-size: 0.9rem; color: var(--text-muted);">
                                ${strip.pages} pag.
                            </div>
                        </div>
                    `;
                });
            }

            html += `</div>`;
            workspace.innerHTML = html;
        }

        function addNewProject() {
            const title = prompt("Voer de naam van het nieuwe project in:", "Nieuw Filmproject");
            if (!title) return;

            const newId = Date.now();
            appData.projects.push({
                id: newId,
                title: title,
                strips: []
            });

            saveToLocalStorage();
            selectProject(newId);
        }

        function deleteProject(id) {
            if (appData.projects.length <= 1) {
                alert("Je kunt het laatste project niet verwijderen.");
                return;
            }
            if (confirm("Weet je zeker dat je dit project wilt verwijderen?")) {
                appData.projects = appData.projects.filter(p => p.id !== id);
                currentProjectId = appData.projects[0].id;
                saveToLocalStorage();
                renderProjects();
                selectProject(currentProjectId);
            }
        }

        function addScene(projectId) {
            const project = appData.projects.find(p => p.id === projectId);
            if (!project) return;

            const sceneNr = prompt("Scènenummer (bijv. Sc. 3):", `Sc. ${project.strips.length + 1}`);
            if (!sceneNr) return;

            const title = prompt("Locatie / Titel:", "Straat - Dag");
            const pages = prompt("Aantal pagina's (bijv. 1 2/8):", "1 0/8");
            const desc = prompt("Korte beschrijving:", "");

            project.strips.push({
                id: Date.now(),
                scene: sceneNr,
                intExt: "INT.",
                title: title || "Locatie",
                pages: pages || "1",
                desc: desc || ""
            });

            saveToLocalStorage();
            renderWorkspace();
        }

        // Opslaan en inladen via localStorage in browser
        function saveToLocalStorage() {
            localStorage.setItem('stripboard_data', JSON.stringify(appData));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('stripboard_data');
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                    if (appData.projects && appData.projects.length > 0) {
                        currentProjectId = appData.projects[0].id;
                    }
                } catch (e) {
                    console.error("Fout bij laden lokale data:", e);
                }
            }
        }

        // --- EXPORT FUNCTIE (DOWNLOAD JSON) ---
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "stripboard_projects.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // --- IMPORT FUNCTIE (UPLOAD JSON) ---
        function importData(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = (e) => {
                    try {
                        const parsedData = JSON.parse(e.target.result);
                        if (parsedData.projects && Array.isArray(parsedData.projects)) {
                            appData = parsedData;
                            saveToLocalStorage();
                            if (appData.projects.length > 0) {
                                currentProjectId = appData.projects[0].id;
                            }
                            renderProjects();
                            renderWorkspace();
                            alert("Projecten succesvol geïmporteerd!");
                        } else {
                            alert("Ongeldig bestandsformaat: mist 'projects' array.");
                        }
                    } catch (error) {
                        alert("Fout bij het lezen van het JSON-bestand: " + error);
                    }
                };
            }
        }

        // Start applicatie
        init();
    </script>
</body>
</html>
